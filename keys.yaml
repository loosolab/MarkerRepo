metadata:
  mandatory: True
  display_name: 'Metadata'
  list: False
  desc: 'This part contains the metadata of the list.'
  value:
    id:
      mandatory: True
      display_name: 'ID'
      list: False
      desc: 'Unique identifier of list.'
      value: null
      whitelist: False
      input_type: short_text
    list_name:
      mandatory: True
      display_name: 'List name'
      list: False
      desc: 'Name of the list.'
      value: null
      whitelist: False
      input_type: short_text
    date:
      mandatory: False
      display_name: 'Date'
      list: False
      desc: 'The date when the content of the list was published. Format dd.mm.yyyy.'
      value: null
      whitelist: False
      input_type: date
    marker_type: # region or gene
      mandatory: True
      display_name: 'Type'
      list: False
      desc: 'The type of the list (genomic region or gene).'
      value: null
      whitelist: True
      input_type: select
    genome_version: # hg19, hg38, ...
      mandatory: False
      display_name: 'Genome version'
      list: False
      desc: 'Genome version of markers. WARNING: this key is essential when working with genomic regions!'
      value: null
      whitelist: True
      input_type: select
    source:
      mandatory: False
      display_name: 'Source'
      list: False
      desc: 'The source of the list.'
      value: null
      whitelist: False
      input_type: short_text
    tags:
      mandatory: False # discuss
      display_name: 'Tags'
      list: True
      desc: 'Tags which describe the list.'
      value: null
      whitelist: False # discuss 
      input_type: short_text
    organism: # merge needed? simplify organism?
      mandatory: True
      display_name: 'Organism'
      list: False
      desc: 'The organism identifier is composed of the organism name and the Taxonomy ID.'
      special_case:
        merge: organism_name
      value:
        organism_name:
          mandatory: True
          display_name: 'Organism name'
          list: False
          desc: ''
          value: null
          whitelist: True
          input_type: select
        taxonomy_id:
          mandatory: False
          display_name: 'Taxonomy ID'
          list: False
          desc: ''
          value: null
          whitelist: True
          input_type: select
    submitter:
      mandatory: True
      display_name: 'Submitter'
      list: False
      desc: 'The one who submitted the list to the repository.'
      value:
        name:
          mandatory: True
          display_name: 'Name'
          list: False
          desc: "The name should be entered in the format 'Last name, First name'."
          value: null
          whitelist: False
          input_type: short_text
        email: # do we need this?
          mandatory: False 
          display_name: 'Email'
          list: False
          desc: 'The email adress of the submitter.'
          value: null
          whitelist: False
          input_type: short_text

marker_list:
  mandatory: True
  display_name: 'Marker list'
  list: True
  desc: 'Summary description of the marker lists you wish to add.'
  value:
    name: # name of sublist
      mandatory: True
      display_name: 'Name'
      list: False
      desc: 'The name of the sublist.'
      value: null
      whitelist: False
      input_type: short_text

    # wouldn't it be easier to outsource the  markers itself? by just checking correct spelling by using the whitelists?
    markers: # marker list itself
      mandatory: True
      display_name: 'Markers'
      list: True
      desc: 'List of markers'
      value: null
      whitelist: False
      input_type: short_text