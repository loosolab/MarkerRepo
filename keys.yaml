metadata:
  mandatory: True
  list: False
  desc: 'This part contains the metadata of the list.'
  value:
    id:
      mandatory: True
      list: False
      desc: 'Unique identifier of list.'
      value: null
      whitelist: False
      input_type: short_text
    list_name:
      mandatory: True
      list: False
      desc: 'Name of the list.'
      value: null
      whitelist: False
      input_type: short_text
    date:
      mandatory: True
      list: False
      desc: 'The date when the content of the list was published. Format dd.mm.yyyy.'
      value: null
      whitelist: False
      input_type: date
    source:
      mandatory: True
      list: False
      desc: 'The source of the list.'
      value: null
      whitelist: False
      input_type: short_text
    tags:
      mandatory: False # discuss
      list: True
      desc: 'Tags which describe the list.'
      value: null
      whitelist: False # discuss 
      input_type: short_text
    organism: # merge needed? simplify organism?
      mandatory: True
      list: False
      desc: 'The organism identifier is composed of the organism name and the Taxonomy ID.'
      special_case:
        merge: organism_name
      value:
        organism_name:
          mandatory: True
          list: False
          desc: ''
          value: null
          whitelist: True
          input_type: select
        taxonomy_id:
          mandatory: True
          list: False
          desc: ''
          value: null
          whitelist: True
          input_type: select
    submitter:
      mandatory: True
      list: False
      desc: 'The one who submitted the list to the repository.'
      value:
        name:
          mandatory: True
          list: False
          desc: "The name should be entered in the format 'Last name, First name'."
          value: null
          whitelist: False
          input_type: short_text
        email:
          mandatory: True # do we need this?
          list: False
          desc: 'The email adress of the submitter.'
          value: null
          whitelist: False
          input_type: short_text

marker_list:
  mandatory: True
  list: True
  desc: 'Summary description of the marker lists you wish to add.'
  value:
    name: # name of sublist
      mandatory: True
      list: False
      desc: ''
      value: null
      whitelist: False
      input_type: short_text
    type: # region or gene
      mandatory: True
      list: False
      desc: ''
      value: null
      whitelist: True
      input_type: select
    markers: # marker list itself
      mandatory: True
      list: True
      special_case:
        merge: gene_name
      value:
        gene_name: # marker name
          mandatory: True
          list: False
          desc: ''
          value: null
          whitelist: True
          input_type: select
        ensembl_id: # ensembl ID
          mandatory: True
          list: False
          desc: ''
          value: null
          whitelist: True
          input_type: select

