image: python:3.9

stages:
  - check_and_update_uids
  - commit_and_push

check_and_update_uids:
  stage: check_and_update_uids
  script: 
    - python update_uids.py
  only:
    - dev

commit_and_push:
  stage: commit_and_push
  script:
    - git config --global user.name "Micha Frederick Keßler"
    - git config --global user.email "Micha-Frederick.Kessler@mpi-bn.mpg.de"
    - git add .
    - git commit -m "Update UIDs automatically"
    - git push origin dev
  only:
    - dev
